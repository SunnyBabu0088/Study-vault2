    }

    }

    .view.is-active {
      display: block
    }

    .surface {
      background: rgba(255, 255, 255, .92);
      border: 1px solid var(--line);
      box-shadow: 0 16px 42px rgba(15, 23, 41, .08)

    .field {
      width: 100%;

      border-radius: 14px;
      color: var(--ink);
      background: #f8f9fd;

    .field:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(59, 82, 207, .10);
      outline: 0
    }

    .story-strip {
      scrollbar-width: none
    }

    .story-strip::-webkit-scrollbar {
      display: none
    }

    .story-ring {
      background: linear-gradient(135deg, var(--gold) 5%, var(--pink) 55%, #7c3aed 100%);

      background: linear-gradient(135deg, var(--blue), #56c4e8)
    }

    .presence-dot {
      border: 2px solid #fff
    }

    .presence-online {
      background: var(--green)
    }

    .presence-offline {
      background: var(--offline)
    }

    .presence-typing {
      background: var(--gold);
      animation: pulse 1.1s infinite
    }

    .record-card {
      border-left: 4px solid var(--blue)
    }

      text-decoration: line-through
    }

    .filter-btn[aria-pressed="true"] {
      background: var(--ink);
      color: #fff
    }

    .nav-button {
      color: var(--muted)
    }

    .nav-button.is-active {
      color: var(--blue)
    }

    .conversation {
      transition: background .2s
    }

    .conversation:hover {
      background: #f2f4fb
    }

    .conversation.is-active {
      background: #eaedfa;
      box-shadow: inset 3px 0 0 var(--blue)
    }

    #messages-panel .chat-workspace {
      display: none
    }

    .chat-page {
      min-height: calc(100 * min(var(--vh, 1vh), 1vh) - 8rem)
    }

    .bubble {
      max-width: min(78%, 32rem);
      padding: .72rem .9rem;
      border-radius: 18px;
      line-height: 1.42
    }

    .bubble.mine {
      align-self: flex-end;
      border-bottom-right-radius: 5px;
      background: var(--blue);
      color: #fff
    }

    .bubble.theirs {
      align-self: flex-start;
      border-bottom-left-radius: 5px;
      background: #eceef5;
      color: var(--ink)
    }

    .post-card {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      padding: 1rem;
      margin-bottom: 1rem
    }

    .badge-public {
      background: #e8f5e9;
      color: #2e7d32;
      font-size: .7rem;
      padding: 2px 8px;
      border-radius: 99px;
      font-weight: 700
    }

    .badge-private {
      background: #fce4ec;
      color: #c62828;
      font-size: .7rem;
      padding: 2px 8px;
      border-radius: 99px;
      font-weight: 700
    }

    .post-actions {
      display: flex;
      gap: .5rem;
      flex-wrap: wrap;
      margin-top: .75rem
    }

    .post-actions button {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: .78rem;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #fafbfe;
      color: var(--muted);
      transition: all .2s
    }

    .post-actions button:hover {
      background: #eaedfa;
      color: var(--blue)
    }

    .post-actions button.liked {
      color: var(--pink);
      border-color: var(--pink);
      background: #fef0f5
    }

    .media-preview {
      width: 100%;
      max-height: 240px;
      object-fit: cover;
      border-radius: 14px;
      margin-top: .75rem
    }

    .streak-badge {
      display: inline-flex;
      align-items: center;

      font-size: .85rem;
      padding: 6px 14px;
      border-radius: 99px;
      box-shadow: 0 4px 12px rgba(255, 107, 53, .25)
    }

    .streak-badge.no-streak {
      background: #eceef5;
      color: var(--muted);
      box-shadow: none
    }

    @keyframes lift {
      from {
        opacity: 0;
        transform: translateY(12px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @keyframes pulse {
      50% {
        transform: scale(.72);
        opacity: .62
      }
    }

    @media(max-width:900px) {
      .message-layout {
        grid-template-columns: 1fr
      }

      .conversation-column {
        max-height: 252px;
        overflow-y: auto
      }
    }

  <script src="/_sdk/63fd4d761b113c12.editing_sdk.js"
    integrity="sha512-aW4ACIU0/KrFYzLKO4Ga7VOCTueMaROtXMSDTLcFBkau75iu7+Yr4DdM/ASm2rkqhWtRVWRePg9Bbm+fOky2ZQ=="></script>
  <script src="/_sdk/0e8d3a91e1c6f495.data_sdk.js"
    integrity="sha512-c00oDoGjsMgluCLLEyVl3suwEkgjOGGplVFbsilUoBg4aMKNmsL3mwsc9r0dPn95qiSZyjBousQXgROkAW7p/w=="></script>
  <script>
    let records = [], activeFilter = "all", activeContact = null, sdkReady = false;
    let selectedMediaDataUrl = null, selectedMediaType = null;

    const emptyRecord = { type: "", title: "", content: "", completed: false, priority: "", due_date: "", subject: "", present: 0, total: 0, grade: "", credits: 0, semester: "", category: "", created_at: "", visibility: "", file_type: "", file_name: "", friends: "", streak_count: 0, last_chat_date: "", username: "", email: "", phone: "", roll_number: "", hashtags: "", scheduled_date: "", likes: 0, bio: "", media_url: "", suggestions: "", saved_by: "", extended_from: "" };

    const setMessage = (id, text, error = false) => {
      const e = document.getElementById(id);
      if (e) { e.textContent = text; e.style.color = error ? "#d83d72" : "#5a6478"; }
    };

    const notes = [];
    const tasks = [];

    const apiRequest = async (path, options = {}) => {
      const { method = 'GET', body, headers = {}, ...rest } = options;
      const init = {
        method,
        credentials: 'include',
        headers: { ...headers },
        ...rest,
      };

      if (body !== undefined) {
        init.headers['Content-Type'] = 'application/json';
        init.body = JSON.stringify(body);
      }

      const response = await fetch(path, init);
      const data = await response.json().catch(() => null);
      if (!response.ok) {
        const errorText = data?.error || response.statusText || 'API request failed';
        throw new Error(errorText);
      }
      return data;
    };

    const vault = () => tasks;

    function getToday() {
      return new Date().toISOString().slice(0, 10);
    }

    function getProfile() {
      return records.find(r => r.category === "meta" && r.type === "profile");
    }

    // Streak logic: call before sending a message
    async function updateStreak() {
      const profile = getProfile();
      if (!profile) return;
      const today = getToday();
      const lastDate = profile.last_chat_date || "";
      if (lastDate === today) return; // already chatted today

      let newStreak = profile.streak_count || 0;
      if (lastDate) {
        const last = new Date(lastDate + "T00:00:00");
        const now = new Date(today + "T00:00:00");
        const diffDays = Math.round((now - last) / (1000 * 60 * 60 * 24));
        if (diffDays === 1) {
          newStreak += 1;
        } else if (diffDays > 1) {
          // missed days — lose one week of streak
          newStreak = Math.max(0, newStreak - 7);
        }
      } else {
        newStreak = 1;
      }
      await window.dataSdk.update({ ...profile, streak_count: newStreak, last_chat_date: today });
    }

    function renderStreak() {
      const profile = getProfile();
      const count = profile ? (profile.streak_count || 0) : 0;
      const el = document.getElementById("streak-display");
      const text = document.getElementById("streak-count-text");
      text.textContent = count + (count === 1 ? " day streak" : " day streak");
      el.classList.toggle("no-streak", count === 0);
    }

    function renderRecords() {
      const list = document.getElementById("item-list");
      const items = vault().filter(task => activeFilter === "all" || (activeFilter === "open" ? !task.completed : task.completed));
      list.innerHTML = "";
      items.forEach(task => {
        const el = document.getElementById("record-template").content.cloneNode(true).firstElementChild;
        el.classList.toggle("is-complete", task.completed);
        el.querySelector(".record-priority").textContent = task.priority || "Medium";
        el.querySelector(".record-subject").textContent = task.subject || "Study";
        el.querySelector(".record-title").textContent = task.title;
        el.querySelector(".record-content").textContent = task.content || "";
        el.querySelector(".complete-btn i").classList.toggle("hidden", !task.completed);
        el.querySelector(".complete-btn").onclick = () => toggleTaskCompletion(task, !task.completed);
        el.querySelector(".delete-btn").onclick = () => removeTask(task);
        list.appendChild(el);
      });
      document.getElementById("empty-vault").classList.toggle("hidden", items.length > 0);
      document.getElementById("total-count").textContent = vault().length;
      document.getElementById("open-count").textContent = vault().filter(task => !task.completed).length;
      document.getElementById("priority-count").textContent = vault().filter(task => !task.completed && task.priority === "High").length;
      lucide.createIcons();
    }

    function renderMessages() {
      const list = document.getElementById("chat-page-list");
      if (!activeContact) return;
      list.innerHTML = "";
      document.getElementById("chat-page-name").textContent = activeContact;
      const items = records.filter(r => r.category === "private" && r.subject === activeContact);
      if (items.length === 0) list.innerHTML = '<p class="m-auto text-sm text-[#9aa3b4]">No messages yet. Say hi!</p>';
      items.forEach(r => { const el = document.getElementById("message-template").content.cloneNode(true).firstElementChild; el.classList.add(r.title === "You" ? "mine" : "theirs"); el.querySelector(".message-content").textContent = r.content; list.appendChild(el); });
      list.scrollTop = list.scrollHeight;
    }

    function renderPosts() {
      const feed = document.getElementById("startup-feed");
      const posts = records.filter(r => r.category === "startup");
      feed.innerHTML = "";
      posts.forEach(r => {
        const el = document.getElementById("post-template").content.cloneNode(true).firstElementChild;
        el.querySelector(".post-title").textContent = r.title;
        el.querySelector(".post-content").textContent = r.content;
        el.querySelector(".post-hashtags").textContent = r.hashtags || "";
        el.querySelector(".post-bio").textContent = r.bio || "";
        const badge = el.querySelector(".post-visibility-badge");
        badge.textContent = r.visibility === "private" ? "Private" : "Public";
        badge.className = "post-visibility-badge " + (r.visibility === "private" ? "badge-private" : "badge-public");
        if (r.media_url) { const img = el.querySelector(".post-media"); img.src = r.media_url; img.classList.remove("hidden"); }
        if (r.scheduled_date) { el.querySelector(".post-schedule").textContent = "📅 Scheduled: " + new Date(r.scheduled_date).toLocaleString(); }
        el.querySelector(".like-count").textContent = r.likes || 0;
        el.querySelector(".like-btn").onclick = () => updateRecord(r, { likes: (r.likes || 0) + 1 });
        el.querySelector(".suggest-btn").onclick = () => {
          const area = el.querySelector(".suggest-area"); area.classList.toggle("hidden");
          const sugList = el.querySelector(".suggestions-list"); sugList.innerHTML = "";
          if (r.suggestions) { r.suggestions.split("|||").filter(Boolean).forEach(s => { const p = document.createElement("p"); p.className = "text-xs bg-[#f8f9fd] rounded-lg p-2 border border-[#e2e5ef]"; p.textContent = s; sugList.appendChild(p); }); }
        };
        el.querySelector(".submit-suggest").onclick = () => { const input = el.querySelector(".suggest-input"); if (!input.value.trim()) return; updateRecord(r, { suggestions: (r.suggestions || "") + "|||" + input.value.trim() }); input.value = ""; };
        el.querySelector(".share-btn").onclick = () => { if (navigator.clipboard) { navigator.clipboard.writeText(r.title + ": " + r.content); el.querySelector(".share-btn").innerHTML = '<i data-lucide="check" class="h-3.5 w-3.5"></i> Copied!'; lucide.createIcons(); } };
        el.querySelector(".save-btn").onclick = () => { updateRecord(r, { saved_by: (r.saved_by || "") + ",you" }); el.querySelector(".save-btn").innerHTML = '<i data-lucide="bookmark" class="h-3.5 w-3.5"></i> Saved'; lucide.createIcons(); };
        el.querySelector(".extend-btn").onclick = () => { document.getElementById("post-title-input").value = "Extended: " + r.title; document.getElementById("idea-content").value = r.content + "\n\n--- Extended idea ---\n"; document.getElementById("idea-content").focus(); window.scrollTo({ top: 0, behavior: "smooth" }); };
        feed.appendChild(el);
      });
      document.getElementById("empty-startup").classList.toggle("hidden", posts.length > 0);
      lucide.createIcons();
    }

    async function toggleTaskCompletion(task, completed) {
      if (!sdkReady) return;
      try {
        const response = await apiRequest(`/api/tasks/${task.id}/complete`, {
          method: 'PATCH',
          body: { completed },
        });
        const index = tasks.findIndex(t => t.id === task.id);
        if (index !== -1) {
          tasks[index] = response.data;
          renderRecords();
        }
      } catch (error) {
        setMessage('vault-message', error.message, true);
      }
    }

    async function removeTask(task) {
      if (!sdkReady) return;
      try {
        await apiRequest(`/api/tasks/${task.id}`, { method: 'DELETE' });
        const index = tasks.findIndex(t => t.id === task.id);
        if (index !== -1) {
          tasks.splice(index, 1);
          renderRecords();
        }
      } catch (error) {
        setMessage('vault-message', error.message, true);
      }
    }

    async function loadNotes() {
      try {
        const response = await apiRequest('/api/notes?limit=50&page=1');
        notes.length = 0;
        response.data.forEach(note => notes.push(note));
        renderNotes();
      } catch (error) {
        console.error('Unable to load notes:', error);
      }
    }

    async function loadTasks() {
      try {
        const response = await apiRequest('/api/tasks?limit=50&page=1');
        tasks.length = 0;
        response.data.forEach(task => tasks.push(task));
        renderRecords();
      } catch (error) {
        console.error('Unable to load tasks:', error);
      }
    }

    // Navigation
    document.querySelectorAll("[data-view]").forEach(button => button.addEventListener("click", () => {
      const view = button.dataset.view;
      document.querySelectorAll(".view").forEach(s => s.classList.toggle("is-active", s.id === view));
      document.querySelectorAll(".nav-button").forEach(nav => nav.classList.toggle("is-active", nav.dataset.view === view));
      window.scrollTo({ top: 0, behavior: "smooth" });
    }));

    // Filters
    document.querySelectorAll("[data-filter]").forEach(btn => btn.addEventListener("click", () => {
      activeFilter = btn.dataset.filter;
      document.querySelectorAll("[data-filter]").forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
      renderRecords();
    }));

    // Conversations
    document.querySelectorAll(".conversation").forEach(btn => btn.addEventListener("click", () => {
      activeContact = btn.dataset.contact;
      document.querySelectorAll(".conversation").forEach(b => b.classList.toggle("is-active", b === btn));
      document.getElementById("messages-panel").classList.add("hidden");
      document.getElementById("chat-page").classList.add("is-active");
      renderMessages();
    }));
    document.getElementById("chat-back").addEventListener("click", () => {
      document.getElementById("chat-page").classList.remove("is-active");
      document.getElementById("messages-panel").classList.remove("hidden");
    });

    // Notebook notes use the same Canva Sheet records as the rest of the app.
    const noteThemes = { lavender: "linear-gradient(135deg,#f1edff,#ffffff)", sunrise: "linear-gradient(135deg,#fff1d6,#ffffff)", mint: "linear-gradient(135deg,#dcf8ed,#ffffff)", midnight: "linear-gradient(135deg,#202942,#39466b)" };
    function renderNotes() {
      const list = document.getElementById("notes-list");
      list.innerHTML = "";
      notes.forEach(note => {
        const card = document.createElement("article");
        card.className = "rounded-2xl border border-[#e2e5ef] p-4 shadow-sm";
        card.style.background = noteThemes[note.theme] || noteThemes.lavender;
        if (note.theme === "midnight") {
          card.style.color = "#fff";
        }
        card.innerHTML = `<h3 class="m-0 font-bold"></h3><p class="mt-2 whitespace-pre-wrap text-sm"></p>`;
        card.querySelector("h3").textContent = note.title;
        card.querySelector("p").textContent = note.content;
        list.appendChild(card);
      });
    }
    document.getElementById("note-form").addEventListener("submit", async e => {
      e.preventDefault();
      if (!sdkReady) return;
      const btn = document.getElementById("note-save-button");
      btn.disabled = true;
      try {
        await apiRequest('/api/notes', {
          method: 'POST',
          body: {
            title: document.getElementById('note-title').value.trim(),
            content: document.getElementById('note-content').value.trim(),
            theme: document.getElementById('note-theme').value,
          },
        });
        document.getElementById('note-form').reset();
        await loadNotes();
      } catch (error) {
        setMessage('vault-message', error.message, true);
      } finally {
        btn.disabled = false;
      }
    });

    // Study form
    document.getElementById("study-form").addEventListener("submit", async e => {
      e.preventDefault();
      if (!sdkReady) return setMessage("vault-message", "Connecting…", true);
      if (!e.currentTarget.checkValidity()) return e.currentTarget.reportValidity();
      const btn = document.getElementById("save-button"); btn.disabled = true;
      try {
        await apiRequest('/api/tasks', {
          method: 'POST',
          body: {
            subject: document.getElementById('subject').value.trim(),
            title: document.getElementById('item-title').value.trim(),
            content: document.getElementById('content').value.trim(),
            priority: document.getElementById('priority').value,
            due_date: document.getElementById('due-date').value || null,
            completed: false,
          },
        });
        e.currentTarget.reset();
        setMessage('vault-message', 'Saved!');
        await loadTasks();
      } catch (error) {
        setMessage('vault-message', error.message, true);
      } finally {
        btn.disabled = false;
      }
    });

    // Private message form with streak
    document.getElementById("private-form").addEventListener("submit", async e => {
      e.preventDefault();
      const input = document.getElementById("private-input");
      if (!sdkReady || !activeContact || !input.value.trim()) return;
      const btn = document.getElementById("private-send"); btn.disabled = true;
      await updateStreak();
      const result = await window.dataSdk.create({ ...emptyRecord, type: "Message", title: "You", content: input.value.trim(), subject: activeContact, category: "private", created_at: new Date().toISOString() });
      btn.disabled = false;
      if (result.isOk) e.currentTarget.reset();
    });

    // Media handling
    document.getElementById("add-image-btn").addEventListener("click", () => { const fi = document.getElementById("media-file-input"); fi.accept = "image/*"; fi.click(); });
    document.getElementById("add-video-btn").addEventListener("click", () => { const fi = document.getElementById("media-file-input"); fi.accept = "video/*"; fi.click(); });
    document.getElementById("skip-media-btn").addEventListener("click", () => { document.getElementById("media-prompt").classList.add("hidden"); });
    document.getElementById("remove-media-btn").addEventListener("click", () => { selectedMediaDataUrl = null; selectedMediaType = null; document.getElementById("media-preview-container").classList.add("hidden"); document.getElementById("media-preview-img").classList.add("hidden"); document.getElementById("media-preview-video").classList.add("hidden"); });
    document.getElementById("media-file-input").addEventListener("change", e => {
      const file = e.target.files[0]; if (!file) return;
      selectedMediaType = file.type.startsWith("video") ? "video" : "image";
      const reader = new FileReader();
      reader.onload = ev => { selectedMediaDataUrl = ev.target.result; const container = document.getElementById("media-preview-container"); container.classList.remove("hidden"); if (selectedMediaType === "image") { document.getElementById("media-preview-img").src = selectedMediaDataUrl; document.getElementById("media-preview-img").classList.remove("hidden"); document.getElementById("media-preview-video").classList.add("hidden"); } else { document.getElementById("media-preview-video").src = selectedMediaDataUrl; document.getElementById("media-preview-video").classList.remove("hidden"); document.getElementById("media-preview-img").classList.add("hidden"); } };
      reader.readAsDataURL(file);
    });

    // Startup form
    document.getElementById("startup-form").addEventListener("submit", async e => {
      e.preventDefault();
      if (!sdkReady) return setMessage("startup-message", "Connecting…", true);
      if (!e.currentTarget.checkValidity()) return e.currentTarget.reportValidity();
      const btn = document.getElementById("post-button"); btn.disabled = true;
      const result = await window.dataSdk.create({ ...emptyRecord, type: "Post", title: document.getElementById("post-title-input").value.trim(), content: document.getElementById("idea-content").value.trim(), hashtags: document.getElementById("hashtags-input").value.trim(), visibility: document.getElementById("visibility-select").value, scheduled_date: document.getElementById("schedule-input").value ? new Date(document.getElementById("schedule-input").value).toISOString() : "", media_url: selectedMediaDataUrl || "", category: "startup", created_at: new Date().toISOString() });
      btn.disabled = false;
      if (result.isOk) { e.currentTarget.reset(); selectedMediaDataUrl = null; selectedMediaType = null; document.getElementById("media-preview-container").classList.add("hidden"); document.getElementById("media-preview-img").classList.add("hidden"); document.getElementById("media-preview-video").classList.add("hidden"); document.getElementById("media-prompt").classList.remove("hidden"); setMessage("startup-message", "Idea shared!"); } else { setMessage("startup-message", "Failed to share", true); }
    });

    // Profile form
    document.getElementById("profile-form").addEventListener("submit", async e => {
      e.preventDefault(); if (!sdkReady) return;
      const existing = getProfile();
      const data = { ...emptyRecord, type: "profile", category: "meta", username: document.getElementById("profile-username").value.trim(), email: document.getElementById("profile-email").value.trim(), phone: document.getElementById("profile-phone").value.trim(), roll_number: document.getElementById("profile-roll").value.trim(), streak_count: existing ? existing.streak_count : 0, last_chat_date: existing ? existing.last_chat_date : "", created_at: new Date().toISOString() };
      const result = existing ? await window.dataSdk.update({ ...existing, ...data }) : await window.dataSdk.create(data);
      if (result.isOk) setMessage("profile-message", "Profile saved!");
    });

    async function initialize() {
      lucide.createIcons();
      const result = await window.dataSdk.init({
        onDataChanged(data) {
          records = data.slice();
          renderRecords();
          renderMessages();
          renderPosts();
          renderNotes();
          renderStreak();
          const p = getProfile();
          if (p) {
            document.getElementById("profile-username").value = p.username || "";
            document.getElementById("profile-email").value = p.email || "";
            document.getElementById("profile-phone").value = p.phone || "";
            document.getElementById("profile-roll").value = p.roll_number || "";
            document.getElementById("profile-display-name").textContent = p.username || "Student";
            document.getElementById("profile-display-email").textContent = p.email || "";
          }
        }
      });
      sdkReady = result.isOk;
      await Promise.all([loadNotes(), loadTasks()]);
    }
    initialize();
  </script>
</body>

</html>
