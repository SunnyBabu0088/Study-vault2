services:
  db:
    image: postgres:16-alpine
    container_name: studyvault-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      POSTGRES_DB: ${POSTGRES_DB:-studyvault}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-studyvault}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - studyvault-net-prod

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studyvault-backend-prod
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-studyvault}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be provided in production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be provided in production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5500}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      UPLOAD_DIR: uploads
      UPLOAD_MAX_SIZE_MB: ${UPLOAD_MAX_SIZE_MB:-10}
    volumes:
      - uploads_data_prod:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - studyvault-net-prod

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: studyvault-frontend-prod
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5500}:80"
    depends_on:
      - backend
    networks:
      - studyvault-net-prod

volumes:
  pgdata_prod:
    name: studyvault-pgdata-prod
  uploads_data_prod:
    name: studyvault-uploads-prod

networks:
  studyvault-net-prod:
    name: studyvault-network-prod
    driver: bridge
