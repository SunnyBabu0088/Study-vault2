services:
  db:
    image: postgres:16-alpine
    container_name: studyvault-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-studyvault}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-studyvault}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - studyvault-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: studyvault-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-studyvault}
      DATABASE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-development-jwt-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-development-refresh-secret}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5500}
      COOKIE_SECURE: "false"
      UPLOAD_DIR: uploads
      UPLOAD_MAX_SIZE_MB: 10
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - studyvault-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: studyvault-frontend
    restart: unless-stopped
    environment:
      VITE_PROXY_TARGET: http://backend:5000
      VITE_API_BASE_URL: ""
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5500:5500"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5500', (r) => process.exit(r.statusCode ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - studyvault-net

volumes:
  pgdata:
    name: studyvault-pgdata
  uploads_data:
    name: studyvault-uploads

networks:
  studyvault-net:
    name: studyvault-network
    driver: bridge
